---
# Internal constants of the eternal_terminal role.

# ET transport port. Sessions authenticate with SSH on port 22334.
eternal_terminal_port: 20222

# Architectures in the upstream trixie Release file.
eternal_terminal_architectures: [amd64, arm64]

# The key and the package restriction are written before the source. The
# key is the upstream et.gpg from
# https://github.com/MisterTea/debian-et (commit 7cade1271049), armored
# without changes: RSA 2048, "Jason Gauci <jgmath2000@gmail.com>",
# fingerprint 1B78 07C5 BEBF 69CB 10E6 6BD6 F965 0776 57E8 5C2D.
eternal_terminal_apt_prerequisites:
  - src: npv-eternal-terminal.asc
    dest: /etc/apt/keyrings/npv-eternal-terminal.asc
  - src: npv-eternal-terminal.pref
    dest: /etc/apt/preferences.d/npv-eternal-terminal.pref
eternal_terminal_apt_source:
  src: npv-eternal-terminal.sources
  dest: /etc/apt/sources.list.d/npv-eternal-terminal.sources
eternal_terminal_apt_changed: >-
  {{ eternal_terminal_apt_prerequisites_result is changed
     or eternal_terminal_apt_source_result is changed }}
# URIs and Suites/Components of files/npv-eternal-terminal.sources, as
# apt-cache policy prints them in the version table.
eternal_terminal_index: >-
  https://mistertea.github.io/debian-et/debian-source trixie/main

# The packaged conffile read by et.service (etserver --cfgfile=/etc/et.cfg).
eternal_terminal_config: /etc/et.cfg
# Options that etserver 7.1.1 reads from it (TerminalServerMain.cpp:
# GetValue("Networking", "port"), GetBoolValue("Debug", "telemetry")). The
# unit passes neither as a command-line option, so the file decides.
eternal_terminal_settings:
  - section: Networking
    option: port
    value: "{{ eternal_terminal_port }}"
  - section: Debug
    option: telemetry
    value: "false"

# Derived from apt-cache policy et, which reads only local metadata.
# Installed or known: enough for apt to act on or simulate et; a version
# from dpkg status or another source counts.
eternal_terminal_installed: >-
  {{ eternal_terminal_policy.stdout
     is search('^ +Installed: [0-9]', multiline=True) }}
eternal_terminal_known: >-
  {{ eternal_terminal_policy.stdout
     is search('^ +(Installed|Candidate): [0-9]', multiline=True) }}
# Offered by the managed upstream index: a version-table line
# "<priority> <URI> trixie/main <arch> Packages" for this source only.
eternal_terminal_offered: >-
  {{ eternal_terminal_policy.stdout
     is search('^ +-?[0-9]+ ' ~ (eternal_terminal_index | regex_escape)
               ~ ' [a-z0-9]+ Packages$', multiline=True) }}
# Without that offer the repository setup is incomplete, for example after
# an interrupted run, and the indexes are refreshed.
eternal_terminal_refresh: >-
  {{ eternal_terminal_apt_changed or not eternal_terminal_offered }}
# Every listening TCP socket with its process, from the local socket table.
eternal_terminal_ss: [ss, -Hltnp]
# The ss result being judged; the post-restart tasks override it.
eternal_terminal_ss_result: "{{ eternal_terminal_listen }}"
eternal_terminal_ss_ok: "{{ eternal_terminal_ss_result.rc | default(-1) == 0 }}"
eternal_terminal_ss_text: >-
  {{ eternal_terminal_ss_result.stdout | default('') }}
eternal_terminal_ss_error: >-
  {{ eternal_terminal_ss | join(' ') }} failed with exit code
  {{ eternal_terminal_ss_result.rc | default('none') }}:
  {{ (eternal_terminal_ss_result.stderr | default('') ~ ' '
      ~ eternal_terminal_ss_result.msg | default('')) | trim }}. The
  listener of etserver was not observed.
# Process names on the managed port, and ports on which etserver listens.
# Kept here so that Jinja does not process the backslashes.
eternal_terminal_local_re: '(?m)^\S+\s+\d+\s+\d+\s+\S*:'
eternal_terminal_holder_re: >-
  {{ eternal_terminal_local_re }}{{ eternal_terminal_port
  }}\s+\S+\s+users:\(\("([^"]+)",
eternal_terminal_etserver_re: >-
  {{ eternal_terminal_local_re }}(\d+)\s+\S+\s+users:\(\("etserver",
eternal_terminal_holders: >-
  {{ eternal_terminal_ss_text | regex_findall(eternal_terminal_holder_re)
     | unique | sort }}
eternal_terminal_etserver_ports: >-
  {{ eternal_terminal_ss_text | regex_findall(eternal_terminal_etserver_re)
     | map('int') | unique | sort }}
# healthy: only etserver listens on the port; occupied: another process
# does; absent: nothing does.
eternal_terminal_state: >-
  {{ 'healthy' if eternal_terminal_holders == ['etserver']
     else 'occupied' if eternal_terminal_holders | length > 0
     else 'absent' }}
eternal_terminal_failure: >-
  {{ 'TCP ' ~ eternal_terminal_port ~ ' is held by '
     ~ eternal_terminal_holders | reject('eq', 'etserver') | join(', ')
     ~ ', not by etserver alone; free the port, a restart cannot take it.'
     if eternal_terminal_state == 'occupied'
     else 'etserver does not listen on TCP ' ~ eternal_terminal_port
     ~ (' after the restart'
        if eternal_terminal_restarted | default({}) is changed
        else ' within 10 s of its start') ~ '.' }}
  etserver listens on {{ eternal_terminal_etserver_ports | join(', ')
  or 'no TCP port' }}. See journalctl -u et.service and
  {{ eternal_terminal_config }}.

# Check mode only (defaults/main.yml): ss is missing, iproute2 is not
# installed now, and the caller says that a normal run installs it before
# this role. Only the listener observation is deferred then.
eternal_terminal_ss_deferred: >-
  {{ ansible_check_mode
     and eternal_terminal_iproute2_install_planned | bool
     and not eternal_terminal_ss_stat.stat.exists
     and eternal_terminal_iproute2_state.stdout is not match('ii') }}

# Restart a service that was running before this run if a setting changed
# or if it does not own the port; a service started by this run already
# reads both settings. At most one restart. With the listener read deferred,
# only a changed setting predicts a restart.
eternal_terminal_restart: >-
  {{ eternal_terminal_start is not changed
     and ((eternal_terminal_cfg is changed
           and (eternal_terminal_listen is not skipped
                or eternal_terminal_ss_deferred))
          or (eternal_terminal_listen is not skipped
              and eternal_terminal_state != 'healthy')) }}
