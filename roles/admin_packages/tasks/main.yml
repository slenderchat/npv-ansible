---
# An empty list is a no-op: the apt module would still refresh the indexes.
- name: Install the administration packages
  when: admin_packages_list | length > 0
  block:
    # Check mode reads only the local APT indexes, so on a fresh host apt may
    # not know some packages yet. "Installed" and "Candidate" are versions or
    # "(none)"; an unknown package produces no output.
    - name: Read the local APT metadata for the administration packages
      ansible.builtin.command:
        argv: [apt-cache, policy, "{{ item }}"]
      environment:
        LC_ALL: C
      check_mode: false
      changed_when: false
      loop: "{{ admin_packages_list }}"
      register: admin_packages_policy
      when: ansible_check_mode

    - name: Identify the packages that are neither installed nor available
      ansible.builtin.set_fact:
        admin_packages_missing: >-
          {{ admin_packages_policy.results
             | rejectattr('stdout', 'search',
                          '^ +(Installed|Candidate): [0-9]', multiline=True)
             | map(attribute='item') | unique | list }}
      when: ansible_check_mode

    # Normal runs pass the whole list. In check mode the module never
    # refreshes indexes, and update_cache is disabled to make that explicit;
    # it simulates the packages known locally and shows their transaction
    # with --diff.
    - name: Install the administration packages with apt
      ansible.builtin.apt:
        name: "{{ admin_packages_names }}"
        state: present
        install_recommends: false
        update_cache: "{{ not ansible_check_mode }}"
        cache_valid_time: 3600
      vars:
        admin_packages_names: >-
          {{ admin_packages_list | difference(admin_packages_missing)
             if ansible_check_mode else admin_packages_list }}
      when: admin_packages_names | length > 0

    - name: Report the packages that apt cannot simulate yet
      ansible.builtin.debug:
        msg: >-
          Requested packages that are neither installed nor in the local APT
          indexes: {{ admin_packages_missing | join(', ') }}. The complete
          package transaction cannot be determined until APT metadata for
          these packages is available on the host; any transaction simulated
          above leaves them out.
      changed_when: true
      when: ansible_check_mode and admin_packages_missing | length > 0
