---
# Internal constants of the dns_resolver role. The upstream list itself,
# dns_resolver_upstreams, is a required group variable without a default.

# Packages the role needs on the managed host: the resolver itself, dig for
# the stub query, the CA bundle for certificate checks of the DNS-over-TLS
# upstreams, and lsattr/chattr for the immutable attribute.
dns_resolver_packages:
  - systemd-resolved
  - bind9-dnsutils
  - ca-certificates
  - e2fsprogs

dns_resolver_dpkg_query_argv:
  - dpkg-query
  - --show
  - --showformat=${Package} ${db:Status-Abbrev}\n

dns_resolver_dropin_dir: /etc/systemd/resolved.conf.d
dns_resolver_dropin_path: /etc/systemd/resolved.conf.d/50-dns_resolver.conf

# Files under this directory are generated by systemd-resolved itself.
dns_resolver_resolved_runtime_dir: /run/systemd/resolve/

dns_resolver_probe_name: deb.debian.org.

# One upstream in the systemd-resolved endpoint syntax: IPv4:port#tls-name.
dns_resolver_upstream_pattern: >-
  ^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])[.]){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]):[1-9][0-9]{0,4}#[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$
