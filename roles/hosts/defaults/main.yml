---
# Additional /etc/hosts records rendered after the standard entries, in order.
# Each record is an address and an ordered list of names, for example:
#   hosts_extra_records:
#     - address: 192.0.2.10
#       names:
#         - example-01.example.org
#         - example-01
hosts_extra_records: []

# Check mode only; a normal run ignores it and requires lsattr and chattr.
# Set it to true only when the same run, in a normal run, installs e2fsprogs
# before this role. A check run on a host without e2fsprogs then reports the
# immutable flag of /etc/hosts as unknown instead of failing.
hosts_e2fsprogs_install_planned: false
